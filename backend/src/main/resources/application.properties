server.port=8080
spring.application.name=file-converter-backend

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Temporary file storage path
fileconverter.storage.temp-dir=./temp-storage
fileconverter.storage.cleanup-minutes=60

# OCR configurations
fileconverter.ocr.confidence-threshold=65.0
fileconverter.ocr.default-language=eng
fileconverter.ocr.supported-languages=eng,spa,fra,deu,ita,por

# Logging
logging.level.com.fileconverter=INFO
